<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Dark Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#140608" />
      <stop offset="100%" stop-color="#050508" />
    </radialGradient>

    <!-- Crimson Neon Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3355" />
      <stop offset="50%" stop-color="#ff1e44" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4d6d" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.2" flood-color="#ff1e44" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="4.5" flood-color="#ff1e44" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Plate (Square with subtle rounded corners) -->
  <rect width="64" height="64" rx="12" fill="url(#bgGlow)" stroke="#ff1e44" stroke-opacity="0.3" stroke-width="1" />

  <g filter="url(#neonGlow)">
    <!-- Outer Cyber Shield -->
    <path
      d="M32 7L49 14.5C49 29.5 42 45 32 55C22 45 15 29.5 15 14.5L32 7Z"
      fill="#0c0709"
      stroke="url(#shieldGrad)"
      stroke-width="2.6"
      stroke-linejoin="round"
    />

    <!-- Inner Shield Accent Line -->
    <path
      d="M32 12L44 17.5C44 28.5 38.5 41 32 49C25.5 41 20 28.5 20 17.5L32 12Z"
      stroke="#ff1e44"
      stroke-width="1.2"
      stroke-opacity="0.65"
      fill="none"
    />

    <!-- Padlock Shackle / Loop -->
    <path
      d="M26.5 29V24C26.5 20.96 28.96 18.5 32 18.5C35.04 18.5 37.5 20.96 37.5 24V29"
      stroke="url(#lockGrad)"
      stroke-width="2.6"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Padlock Body -->
    <path
      d="M24 29H40C41.1 29 42 29.9 42 31V41C42 42.1 41.1 43 40 43H24C22.9 43 22 42.1 22 41V31C22 29.9 22.9 29 24 29Z"
      fill="#14070a"
      stroke="url(#lockGrad)"
      stroke-width="2.2"
      stroke-linejoin="round"
    />

    <!-- Padlock Keyhole -->
    <circle cx="32" cy="34.5" r="2.2" fill="#ff4d6d" />
    <path d="M31 35.5L30.2 40H33.8L33 35.5H31Z" fill="#ff4d6d" />
  </g>
</svg>
